# =============================================================================
# Release Tag — dsh-cc
#
# 发布 PR(release/v* 分支)合入 main 后自动打 tag 并触发 publish.yml,
# 接续 daily-release.yml 的两段式发布流。
#
# 触发器用 pull_request: closed 而非 push + commit message 匹配:对三种
# merge 方式(squash/rebase/merge commit)与合并前改 PR 标题全免疫——
# 版本一律从源分支名 release/v<version> 提取。tag 打在 merge_commit_sha
# (即合入后的 main HEAD)上,满足 publish.yml 的"tag 须在 origin/main 上"
# 祖先门禁。
#
# 为什么显式 gh workflow run:GITHUB_TOKEN 的 push(含 tag)不会触发其他
# workflow,必须 dispatch 点火 publish.yml(需 actions: write)。
#
# 幂等可重跑:远程 tag 已存在则跳过打 tag;无论何种路径,只要 GitHub
# Release 缺失(说明上次 publish 未走完)就补触发 publish.yml——publish
# 侧对已发布版本自动跳过,重试零代价。
# =============================================================================

name: Release Tag

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write   # git tag + push tag
  actions: write    # gh workflow run publish.yml

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag merged release commit and trigger publish
    # head_commit 为 null 的事件(bench: branch 删除)在 if 求值时天然不命中
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract tag from branch name
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          TAG="${HEAD_REF#release/}"
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::分支名 $HEAD_REF 不含合法版本 tag(期望 release/v<major>.<minor>.<patch>[-prerelease])"
            exit 1
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "发布 tag:$TAG(merge commit ${{ github.event.pull_request.merge_commit_sha }})" >> "$GITHUB_STEP_SUMMARY"

      # check-release-version 只读 HEAD 上的 manifest 文件,无需历史
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 1

      # 幂等:tag 已在远端(上次跑成功过/人工打过)则不打,仅走下方恢复判定
      - id: idem
        name: Idempotency check
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "$TAG" | grep -q .; then
            echo "tag $TAG 已在远端,跳过打 tag" >> "$GITHUB_STEP_SUMMARY"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify manifests and tag merge commit
        if: steps.idem.outputs.exists == 'false'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # manifest 版本 != tag 就拒绝打 tag(fail-loud,发布留给人工处理)
          node scripts/check-release-version.mjs "$TAG"
          git tag "$TAG" HEAD
          git push origin "$TAG"
          echo "已在 main 合入提交上打 tag $TAG 并推送" >> "$GITHUB_STEP_SUMMARY"

      # 主路径(刚打完 tag)与恢复路径(tag 在但 publish 未走完)统一收敛:
      # 缺 GitHub Release 就补触发 publish.yml;已有 Release 则记录完成
      - name: Dispatch publish (primary or recovery)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "tag $TAG 已发布(GitHub Release 存在),无需触发" >> "$GITHUB_STEP_SUMMARY"
          else
            gh workflow run publish.yml -f tag="$TAG"
            echo "已触发 publish.yml 发布 $TAG(发布门禁链跑完后在 npm-publish environment 等待人工批准)" >> "$GITHUB_STEP_SUMMARY"
          fi
